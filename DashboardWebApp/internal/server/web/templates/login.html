{{define "login.html"}}
<!DOCTYPE html>
<html lang="{{.DS.Language}}">
<head>
    <meta charset="UTF-8">
    <title>JustInTime Dashboard - Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        :root { --app-font: {{css .FontStack}}; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h1>&#9679; JustInTime</h1>

            {{if .Extra.error}}
            <div class="error-banner">{{.Extra.error}}</div>
            {{end}}

            <p style="color:#7e9ac0; font-size:12px; margin-top:-8px; margin-bottom:20px;">
                {{.T.login_required}}
            </p>

            <form method="POST" action="/login">
                <label for="email">{{.T.login_email}}</label>
                <input type="email" id="email" name="email" required autofocus>

                <label for="password">{{.T.login_password}}</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">{{.T.login}}</button>
            </form>

            <div style="display:flex; align-items:center; gap:10px; margin:18px 0; color:#4a6584; font-size:11px;">
                <div style="flex:1; height:1px; background:#1c3a5e;"></div>
                {{.T.login_or}}
                <div style="flex:1; height:1px; background:#1c3a5e;"></div>
            </div>

            <a href="/auth/oauth/start?provider=google" class="btn btn-outline oauth-btn">
                <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.4 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.4 5.1 29.5 3 24 3 16.1 3 9.2 7.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35.8 26.8 37 24 37c-5.2 0-9.7-3.3-11.3-7.9l-6.5 5C9.1 40.4 16 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3 5.4-5.6 6.9l6.3 5.3C39.7 37.1 43 31 43 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
                {{.T.login_with_google}}
            </a>
            <a href="/auth/oauth/start?provider=azure" class="btn btn-outline oauth-btn" style="margin-top:8px;">
                <svg width="16" height="16" viewBox="0 0 23 23" aria-hidden="true"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
                {{.T.login_with_microsoft}}
            </a>

            <p style="text-align:center; margin-top:18px;">
                <a href="/" style="font-size:12px;">&larr; {{.T.nav_local}}</a>
            </p>
        </div>
    </div>
</body>
</html>
{{end}}
