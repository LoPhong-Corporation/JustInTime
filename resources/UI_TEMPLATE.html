<html lang="vi">
<head>
<meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#0f1316;--win:#171c21;--surf:#1f262c;--txt:#e8edf2;--mut:#93a0ad;--line:#2b343c;--acc:#3cc3bb;--accs:#17383a;--warn:#ff7a52;--c1:#3cc3bb;--c2:#6e9bf0;--c3:#f0bd4a;--c4:#ff7a52;--c5:#b393ea;--c6:#97a3b0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:0}
button,input,select{font:inherit;color:inherit}
.win{width:100%;height:100%;background:var(--win);overflow:hidden;display:flex;flex-direction:column}
.title{height:38px;display:flex;align-items:center;justify-content:space-between;padding-left:14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);flex:none}
.title b{color:var(--txt);font-weight:600;display:flex;gap:8px;align-items:center}
.logo{width:16px;height:16px;border-radius:5px;background:conic-gradient(var(--acc) 0 70%,var(--line) 0)}
.wc{display:flex;height:100%}
.wc span{width:44px;display:grid;place-items:center;cursor:default}
.wc span:hover{background:var(--line)}
.wc span:last-child:hover{background:#c42b1c;color:#fff}
.body{flex:1;display:flex;min-height:0}
nav{width:200px;padding:10px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;flex:none}

main{flex:1;overflow:auto;padding:22px 26px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mut);margin:2px 0 18px}
.grid{display:grid;gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:16px}

.hero{grid-template-columns:minmax(260px,320px) 1fr}
.ring{width:190px;height:190px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;background:conic-gradient(var(--acc) var(--p),var(--line) 0)}

.ring strong{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.ring small{color:var(--mut)}
.live{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px}

@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}

.stat span{color:var(--mut);font-size:12px}
.stat em{font-style:normal;font-size:12px;color:var(--acc)}
.two{grid-template-columns:1.4fr 1fr;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--mut)}
.bar i{width:100%;max-width:38px;background:var(--line);border-radius:5px 5px 2px 2px;display:block}
.bar.today i{background:var(--acc)}
.bar.today{color:var(--txt);font-weight:600}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.focus{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse}

.tw{overflow-x:auto}

.sw input:checked+b{background:var(--acc);border-color:var(--acc)}

.lim{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}

.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set small{display:block;color:var(--mut)}

[data-open]{cursor:pointer}.row[data-open]:hover,tr[data-open]:hover{background:var(--win)}.row[data-open]{border-radius:6px;padding-left:6px;padding-right:6px}
.back{border:0;background:none;color:var(--acc);cursor:pointer;padding:4px 0;margin-bottom:10px;font-weight:600}
.ah{display:flex;gap:14px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.ah h1{line-height:1.2}.ah .st{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--mut)}.off{width:8px;height:8px;border-radius:50%;background:var(--mut)}

.win{position:relative}
.auth{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--win);z-index:4;align-items:center;justify-content:center;padding:16px;overflow:auto;display:none}
.ac{width:100%;max-width:400px;margin:auto}.ab{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{flex:1;border:0;background:none;padding:9px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut)}.tabs button.on{color:var(--txt);border-color:var(--acc);font-weight:600}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.f label.ck{display:flex;gap:8px;align-items:center}
input[type=email],input[type=password],input[type=text],input[type=time]{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--txt);width:100%}
.err{color:var(--warn);min-height:18px;font-size:13px}
.lk{border:0;background:none;color:var(--acc);cursor:pointer;padding:0;text-align:left}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:168px;aspect-ratio:1;padding:8px;background:#fff;border-radius:8px;border:1px solid var(--line)}.qr i{background:#111}.qr i.w{background:#fff}
.code{font-size:30px;font-weight:600;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--accs);color:var(--acc)}.chip.bad{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.dv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.c2{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:14px;align-items:start}
@media(max-width:820px){.c2{grid-template-columns:1fr}}
@property --p{syntax:"<percentage>";inherits:false;initial-value:0%}
.me{display:flex;gap:10px;align-items:center;padding:6px 10px 14px}.me b{font-size:14px}

.ring{transition:--p 1s linear}
.btn,nav button{transition:background-color .15s,transform .1s}.btn:active,nav button:active{transform:scale(.97)}
nav button.on::before{animation:grow .3s ease-out}
body,.win,.card,nav,.auth,.sw b,.sw b::after{transition:background-color .3s,color .3s,border-color .3s,left .15s}
.toast.show{animation:toastin .3s cubic-bezier(.2,.8,.2,1)}
.ac{animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
.err:not(:empty){animation:shake .35s}
.qr{position:relative;overflow:hidden}.qr::after{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:scan 2.2s ease-in-out infinite}
#main .card:has(.qr){animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .2s}
.ic .i{width:20px;height:20px}.btn .i{width:15px;height:15px;vertical-align:-2px;margin-right:6px}

.bigi{display:grid;place-content:center;color:var(--mut)}.bigi .i{width:30px;height:30px}
.lr{display:grid;gap:12px;align-content:start}.lh{display:flex;gap:10px;align-items:center}.lh .lm{flex:1;min-width:0}

.pre{display:flex;gap:6px;flex-wrap:wrap}
.pc{border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:5px 13px;cursor:pointer;transition:background-color .15s,border-color .15s,transform .15s}

.step{display:flex;align-items:center;justify-content:space-between;background:var(--win);border:1px solid var(--line);border-radius:8px;padding:4px}

@keyframes spin{to{transform:rotate(360deg)}}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
.stats>.card,.dv>.card,.lr{transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .25s}
.stats>.card:hover,.dv>.card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 12px 26px rgba(0,0,0,.1)}
.c2>.card:hover,.hero .card:hover{border-color:var(--acc)}

.me:hover .logo{animation:spin .9s ease-in-out}
.ic{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}

.bar i{transition:transform .2s,filter .2s}.bar:hover i{filter:brightness(1.2);transform:scaleX(1.18)}
.heat i{transition:transform .15s}.heat i:hover{transform:scale(1.6);position:relative;z-index:1}

.ring:hover{transform:scale(1.03)}.ring{transition:--p 1s linear,transform .3s}
.lg div{transition:transform .15s}.lg div:hover{transform:translateX(4px)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.14)}
.pc:hover{border-color:var(--acc);transform:translateY(-1px)}.step button:hover{background:var(--accs)}.step button:active,.pc:active{transform:scale(.92)}
.sw:hover b{box-shadow:0 0 0 4px var(--accs)}
.meter i{transition:width .5s cubic-bezier(.2,.8,.2,1),filter .2s}.meter:hover i{filter:brightness(1.15)}

tr[data-open]{transition:background-color .2s}
.back{transition:transform .2s}.back:hover{transform:translateX(-4px)}
.tabs button{transition:color .2s,border-color .2s}.tabs button:hover{color:var(--txt)}
}
.kid{position:absolute;inset:0;z-index:3;background:var(--win);display:none;flex-direction:column;--acc:#2f6fed;--accs:#e2ebff}

.kscroll{flex:1;overflow:auto}.kw{width:100%;max-width:1040px;margin:0 auto;padding:24px 26px 100px;display:grid;gap:16px}
.kh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.kh h1{font-size:28px}
